<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accuretta Notch</title>
<style>
:root {
  --ink: #000;
  --card: #0d0d12;
  --card-2: #13131a;
  --hair: rgba(255,255,255,.065);
  --line: rgba(255,255,255,.09);
  --text: #ecebf3;
  --dim: #8a8898;
  --dim-2: #5d5b6b;
  --paper: #efeadf;
  --blue: #6f86ff;
  --ok: #34d399;
  --bad: #f4505e;
  --amber: #f5a524;
  --risk: 245,165,36;
  --t-amber: 245,165,36;
  --t-green: 52,211,153;
  --t-red: 244,80,94;
  --t-blue: 111,134,255;
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
  --ease-out: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.4 var(--font);
  color: var(--text);
  background: #16161d;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; padding: 0; }
button:focus-visible { outline: 1.5px solid rgba(255,255,255,.55); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ── Island ───────────────────────────────────────────────────────────────
   Width, height and corner radius are driven from script (a spring when it
   grows, an eased curve when it shrinks), never by CSS transitions. */
.island {
  position: absolute; top: 0; left: calc(50% - 98px);
  width: 196px; height: 32px;
  background: var(--ink);
  border-radius: 0 0 16px 16px;
  overflow: hidden;
  cursor: pointer;
  z-index: 10;
  color-scheme: dark;
  box-shadow: 0 10px 30px rgba(0,0,0,.0);
  transition: box-shadow .5s ease, opacity .24s ease-out, transform .38s cubic-bezier(.22,1,.36,1);
}
/* The host window only paints inside the island plus a 36 px margin (its
   click-through region). The shadow must fade out completely inside that
   margin, or Windows cuts it off in a hard rectangle around the island:
   8 px drop + 22 px blur stays well within it. */
.island[data-mode="expanded"] { cursor: default; box-shadow: 0 8px 22px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.04); }
/* slide up into the bezel instead of blinking out, and back down again */
.island.is-leaving { transform: translateY(-104%); opacity: 0; transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .26s ease-in; }
.island.is-entering { transform: translateY(-104%); opacity: 0; transition: none; }

/* ── Views ────────────────────────────────────────────────────────────────
   Every view is laid out at its final size, centred on the island, so the
   island's edges reveal or clip it while it resizes and nothing reflows.
   The outgoing view fades fast; the incoming one waits a beat, then settles. */
.view {
  position: absolute; opacity: 0; pointer-events: none;
  transform: translateY(-3px) scale(.985); transform-origin: 50% 0;
  transition: opacity .13s ease, transform .2s ease;
}
.island[data-state="idle"] .v-idle, .island[data-state="off"] .v-idle,
.island[data-state="work"] .v-work, .island[data-state="alert"] .v-alert,
.island[data-state="ready"] .v-ready, .island[data-state="home"] .v-home,
.island[data-state="gate"] .v-gate, .island[data-state="prompt"] .v-prompt,
.island[data-state="notice"] .v-notice, .island[data-state="drop"] .v-drop {
  opacity: 1; pointer-events: auto; transform: none;
  transition: opacity .26s ease .1s, transform .44s var(--ease-out) .1s;
}

/* compact views: one 32px row at the top edge */
.view.compact { top: 0; left: 50%; height: 32px; }
.v-idle  { width: 196px; margin-left: -98px; }
.v-work  { width: 440px; margin-left: -220px; }
.v-alert { width: 372px; margin-left: -186px; }
.v-ready { width: 340px; margin-left: -170px; }

.pill { display: flex; align-items: center; height: 32px; padding: 0 14px 0 13px; gap: 10px; white-space: nowrap; }
.pill .label { font-weight: 600; font-size: 12.5px; letter-spacing: .005em; }
.pill .sub { color: var(--dim); font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.pill.wings { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 10px; padding: 0 16px 0 13px; }
.wl, .wr { display: flex; align-items: center; gap: 10px; min-width: 0; }
.wl { grid-column: 1; grid-row: 1; }
.pill.wings > span:not(.fx-trail) { grid-column: 2; grid-row: 1; }
.wr { grid-column: 3; grid-row: 1; justify-content: flex-end; gap: 9px; }

#workSub { display: inline-block; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; font: 11.5px/1.5 var(--mono); color: var(--dim); }
#workSub.swap { animation: toolin .32s var(--ease-out); }
/* While the agent works, a soft highlight travels across whatever it is
   doing ("Reading main.py…", "compacting context"), left to right. */
.island[data-state="work"] #workSub {
  background-image: linear-gradient(100deg, #77758a 0%, #77758a 40%, #f4f3fa 50%, #77758a 60%, #77758a 100%);
  background-size: 260% 100%; background-repeat: no-repeat;
  -webkit-background-clip: text; background-clip: text;
  color: transparent; -webkit-text-fill-color: transparent;
  animation: worksheen 1.9s linear infinite;
}
.island[data-state="work"] #workSub.swap { animation: toolin .32s var(--ease-out), worksheen 1.9s linear infinite; }
@keyframes worksheen { from { background-position: 100% 0; } to { background-position: 0% 0; } }
@keyframes toolin { from { opacity: 0; transform: translateY(3px); } }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(var(--t-green),.55); flex: none; }
.dot.amber { background: var(--amber); box-shadow: 0 0 9px rgba(var(--t-amber),.6); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; } }
.island[data-state="off"] .v-idle .dot { background: #3e3d4a; box-shadow: none; }
.island[data-state="off"] #mark { opacity: .3 !important; filter: grayscale(1); }

/* session dots in the idle pill: one per conversation that is working or waiting */
.sdots { display: inline-flex; gap: 5px; align-items: center; }
.sdots:empty { display: none; }
.sdots:not(:empty) + .dot { display: none; }
.sd { width: 6px; height: 6px; border-radius: 50%; background: var(--dim-2); }
.sd.st-working { background: var(--blue); animation: breathe 1.8s ease-in-out infinite; }
.sd.st-needs-you { background: var(--amber); }

/* alert pill: a quiet amber hairline along the bottom edge, nothing that wobbles */
.island::after {
  content: ""; position: absolute; left: 18%; right: 18%; bottom: 0; height: 1.5px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, rgba(var(--t-amber),.9), transparent);
  opacity: 0; transition: opacity .5s ease; pointer-events: none;
}
.island[data-state="alert"]::after { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }

/* ── The mark: one dot-matrix A that travels between views ─────────────────── */
#mark {
  position: absolute; left: 0; top: 0; width: 56px; height: 41.4px;
  transform-origin: 50% 50%; pointer-events: none; z-index: 5;
  will-change: transform;
}
#mark .logo { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mglow {
  position: absolute; left: 50%; top: 55%; width: 125%; height: 135%; transform: translate(-50%,-50%);
  border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--tone, var(--t-blue)), .16), transparent);
  opacity: 0; transition: opacity .8s ease;
}
/* Only a faint tint, and only where the card's tone means something. */
.island[data-state="gate"] #mark { --tone: var(--t-amber); }
.island[data-state="notice"] #mark { --tone: var(--notice-tone, var(--t-green)); }
.island[data-state="gate"] .mglow, .island[data-state="notice"] .mglow { opacity: .7; }
.mslot { display: inline-block; flex: none; width: 26px; height: 19.2px; }
.mslot.big { width: 52px; height: 38.4px; }

/* dot behaviour: each dot has its own phase, speed and floor */
.logo circle { transform-box: fill-box; transform-origin: center; }
.island[data-busy] .logo circle { animation: twinkle var(--p) ease-in-out var(--d) infinite; }
@keyframes twinkle {
  0%, 100% { opacity: var(--lo); transform: scale(.9); }
  12% { opacity: 1; transform: scale(1.08); }
  40% { opacity: .7; transform: none; }
}
.island[data-loading][data-state] .logo circle { animation: powerup 2.6s ease-in-out calc(var(--k) * 1.6s) infinite both; }
@keyframes powerup {
  0%, 100% { opacity: .16; transform: scale(.86); }
  12% { opacity: 1; transform: scale(1.1); }
  60% { opacity: .3; transform: scale(.92); }
}
.island[data-ready][data-state] .logo circle { animation: ready .8s var(--ease-out) calc(var(--k) * .35s) both; }
@keyframes ready { 0% { opacity: .45; transform: scale(.92); } 40% { opacity: 1; transform: scale(1.1); } 100% { opacity: 1; transform: none; } }
.island[data-compact][data-state] .logo circle { animation: compact 1.3s cubic-bezier(.6,0,.3,1) var(--cd) both; }
@keyframes compact { 0%, 100% { transform: none; } 40%, 58% { transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .5)) scale(.6); opacity: .8; } }

/* ── Expanded shell: header + body ───────────────────────────────────────── */
.shell { position: absolute; top: 0; left: 50%; width: 640px; margin-left: -320px; height: 100%; pointer-events: none; }
#header {
  position: absolute; top: 8px; left: 0; right: 0; height: 30px; padding: 0 14px 0 12px;
  display: flex; align-items: center; gap: 4px;
  opacity: 0; transition: opacity .14s ease;
  z-index: 3;   /* above the card surface, which reaches up behind it */
}
.island[data-mode="expanded"] #header { opacity: 1; pointer-events: auto; transition: opacity .3s ease .12s; }
.tab { width: 32px; height: 24px; border-radius: 12px; display: grid; place-items: center; color: var(--dim); transition: background .18s, color .18s; }
.tab:hover { background: rgba(255,255,255,.06); color: #c4c3cf; }
.tab.on { background: #1b1b23; color: var(--text); }
.tab svg, .hbtn svg { width: 15px; height: 15px; display: block; }
.hright { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.hbtn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); transition: color .18s, background .18s; }
.hbtn:hover { color: var(--text); background-color: rgba(255,255,255,.06); }
.hbtn.off { color: var(--dim-2); }
.stat { font: 11px/1 var(--mono); color: var(--dim); }
.stat b { color: var(--text); font-weight: 500; }
.ctx { display: inline-flex; }
.ctx svg { display: block; }
.ctx .trk { stroke: rgba(255,255,255,.12); }
.ctx .arc { stroke: var(--paper); transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1), stroke .3s; }
.ctx.warn .arc { stroke: var(--amber); }
.ctx.crit .arc { stroke: var(--bad); }

.view.expanded { top: 42px; left: 10px; width: 620px; }

/* auto-fold countdown: a hairline that drains toward the centre */
#countdown {
  position: absolute; left: 50%; bottom: 0; width: 140px; margin-left: -70px; height: 2px; border-radius: 2px;
  background: rgba(255,255,255,.32); transform: scaleX(0); opacity: 0; pointer-events: none; z-index: 6;
}

/* ── Cards ─────────────────────────────────────────────────────────────── */
/* ── The surface ──────────────────────────────────────────────────────────
   Cards are not boxes. The surface is a halftone dot field drawn on
   #field (see drawField): crisp at any pixel density, each dot sized and lit
   by the light falling on it, dissolving into the island's black at every
   edge. Cards themselves only lay out content. */
.card { position: relative; border-radius: 18px; }
#field {
  position: absolute; top: 0; left: 0; pointer-events: none;
  opacity: 0; transition: opacity .3s ease;
}
.island[data-mode="expanded"] #field { opacity: 1; transition: opacity .45s ease .05s; }

.avatar-card { display: flex; gap: 16px; padding: 16px 18px 16px 16px; }
.avatar-card > .mslot { margin-top: 2px; }
.cbody { flex: 1; min-width: 0; position: relative; z-index: 1; display: flex; flex-direction: column; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; height: 20px; }
.who b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .smeta { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim-2); flex: none; }
.sdot.st-working { background: var(--blue); animation: breathe 1.8s ease-in-out infinite; }
.sdot.st-needs-you, .sdot.amber { background: var(--amber); }
.sdot.st-finished, .sdot.green { background: var(--ok); }
.sdot.st-failed, .sdot.red { background: var(--bad); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 550;
  transition: transform .12s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
}
.btn:active { transform: scale(.96); }
/* background-COLOR only: the shorthand on :hover would wipe the hold fill
   image, and a held button is always a hovered one */
.btn.pri { background-color: var(--paper); color: #15140f; }
.btn.pri:hover { background-color: #fff; }
.btn.sec { background-color: rgba(255,255,255,.075); color: var(--text); }
.btn.sec:hover { background-color: rgba(255,255,255,.13); }
.btn.ghost { color: var(--dim); padding-left: 8px; padding-right: 8px; }
.btn.ghost:hover { color: var(--text); }
.btn kbd { font: 600 10px/1 var(--mono); padding: 2px 5px; border-radius: 5px; opacity: .55; }
.btn.pri kbd { border: 1px solid rgba(0,0,0,.35); }
.btn.sec kbd { border: 1px solid rgba(255,255,255,.35); }
.actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }

/* hold-to-confirm (strict approvals, power). While held, an amber fill
   sweeps across the button and the ring beside the label closes; let go
   early and both ease back. Both finish exactly as the action fires. */
[data-hold] { -webkit-user-select: none; user-select: none; touch-action: none; }
.btn.pri {
  position: relative;
  background-image: linear-gradient(90deg, rgba(var(--risk), .62), rgba(var(--risk), .9));
  background-repeat: no-repeat; background-size: 0% 100%;
  transition: transform .12s ease, background-color .18s ease, background-size .28s cubic-bezier(.45,0,.2,1), box-shadow .3s ease;
}
.btn.pri.holding {
  background-size: 100% 100%; transform: scale(.97);
  box-shadow: 0 0 0 3px rgba(var(--risk), .18);
  transition: transform .12s ease, background-size var(--hold) linear, box-shadow .3s ease;
}
.hring { width: 15px; height: 15px; flex: none; display: block; }
.hring circle { fill: none; stroke-width: 2.4; }
.hring .trk { stroke: rgba(21,20,15,.18); }
.hring .arc {
  stroke: #15140f; stroke-linecap: round; stroke-dasharray: 37.7; stroke-dashoffset: 37.7;
  transform: rotate(-90deg); transform-origin: 50% 50%;
  transition: stroke-dashoffset .28s cubic-bezier(.45,0,.2,1);
}
.holding .hring .arc { stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold) linear; }
.btn .hl-on { display: none; }
.btn.holding .hl-on { display: inline; }
.btn.holding .hl-off { display: none; }
.icon-btn { background-image: linear-gradient(rgba(var(--t-red),.4), rgba(var(--t-red),.4)); background-repeat: no-repeat; background-position: center; background-size: 0 0; }
.icon-btn.holding { color: var(--bad); animation: holdgrow var(--hold) linear forwards; }
@keyframes holdgrow { to { background-size: 100% 100%; } }
.hbtn.icon-btn:hover { color: var(--bad); }

/* ── Home ─────────────────────────────────────────────────────────────────
   One surface, two columns split by a hairline. Left: the session the notch
   is pointed at — what it is, how far along, what it is doing now. Right:
   everything else, as a quiet list. Nothing boxed inside the box. */
/* the row is pinned to the card's height: a long session list scrolls
   inside its column instead of growing past the island's edge */
.card.home { display: grid; grid-template-columns: minmax(0, 1fr) 168px; grid-template-rows: 128px; height: 128px; }
.now { display: flex; gap: 16px; padding: 16px 20px 12px 18px; min-width: 0; min-height: 0; overflow: hidden; }
.now > .mslot { margin-top: 1px; }
.nowbody { flex: 1; min-width: 0; display: flex; flex-direction: column; }
/* nothing in the column may be squeezed (the empty progress bar would
   collapse to 0 px first) */
.nowbody > * { flex: none; }
.nowhead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nowhead b { font-size: 14px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowhead .hbtn { width: 20px; height: 20px; margin-left: auto; flex: none; opacity: .7; }
.nowhead .hbtn svg { width: 12px; height: 12px; }
.nowmeta { display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 11.5px; color: var(--dim); white-space: nowrap; min-width: 0; }
.nowmeta span { overflow: hidden; text-overflow: ellipsis; }
#hModel:empty, #hCount:empty { display: none; }
#hModel:not(:empty) + #hCount:not(:empty)::before { content: "\00b7"; margin-right: 7px; color: var(--dim-2); }
/* plan progress: one hairline segment per step */
.prog { display: flex; gap: 3px; margin-top: 12px; height: 3px; }
.prog:empty { display: none; }
.prog i { flex: 1; border-radius: 2px; background: rgba(255,255,255,.09); transition: background .5s ease; position: relative; overflow: hidden; }
.prog i.done { background: rgba(239,234,223,.7); }
.prog i.cur { background: rgba(var(--t-blue),.35); }
.prog i.cur::after {
  content: ""; position: absolute; inset: 0; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(var(--t-blue),.9), transparent);
  animation: progsweep 2.2s cubic-bezier(.45,0,.2,1) infinite;
}
@keyframes progsweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.steps { margin-top: 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.step { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.step.cur { color: var(--text); }
.step.next { font-size: 11.5px; color: var(--dim-2); }
.step.next em { font-style: normal; color: var(--dim); }
.step.line { white-space: normal; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.5; margin-top: -2px; }
/* a slim rail: dot and name only (the dot already says the state; the
   word is in the tooltip), split off by a hairline that fades at both ends */
.others { position: relative; padding: 15px 6px 8px 12px; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.others::before {
  content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.08) 30%, rgba(255,255,255,.08) 70%, transparent);
}
.seg { display: flex; gap: 11px; padding: 0 6px; margin-bottom: 5px; }
.seg button { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim-2); transition: color .2s ease; }
.seg button:hover { color: var(--dim); }
.seg button.on { color: var(--text); }
.pane {
  flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 12px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 12px), transparent);
}
.srow { display: flex; align-items: center; gap: 8px; padding: 0 6px; height: 23px; flex: none; border-radius: 7px; text-align: left; min-width: 0; transition: background .15s; }
.srow:hover { background: rgba(255,255,255,.045); }
.srow .nm { flex: 1; min-width: 0; font-size: 11.5px; color: #cfcdd9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .mt { display: none; }
.srow .sdot { width: 5px; height: 5px; }
.empty { color: var(--dim-2); font-size: 11.5px; padding: 4px 6px; }

/* ── Approval gate ──────────────────────────────────────────────────────── */
.tag { white-space: nowrap; flex: none; font-size: 10.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid rgba(var(--t-amber),.4); color: rgb(var(--t-amber)); margin-left: auto; }
.pager { display: inline-flex; align-items: center; color: var(--dim); font: 11px/1 var(--mono); flex: none; }
.pg { color: var(--dim); padding: 0 5px; font-size: 14px; line-height: 1; }
.pg:hover { color: var(--text); }
.cmd {
  margin-top: 10px; font: 12px/1.55 var(--mono); color: #d6d6ff;
  background: rgba(0,0,0,.45); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.meta { display: flex; gap: 14px; margin-top: 8px; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; }
.meta em { font-style: normal; color: var(--text); }
.meta em.warn { color: rgb(var(--t-amber)); }
.diff { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.45); font: 11.5px/1.7 var(--mono); }
.dh { display: flex; justify-content: space-between; gap: 12px; padding: 4px 11px; color: var(--dim); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dh span:first-child { overflow: hidden; text-overflow: ellipsis; }
.cnt u { text-decoration: none; color: #5fd48f; }
.cnt s { text-decoration: none; color: #ff7d8d; }
.dl { display: flex; gap: 10px; padding: 0 11px; white-space: nowrap; }
.dl i { width: 14px; font-style: normal; text-align: right; color: #55526b; }
.dl b { width: 8px; font-weight: 500; }
.dl span { overflow: hidden; text-overflow: ellipsis; }
.dl.del { background: rgba(255,90,110,.1); color: #ffb3bd; }
.dl.add { background: rgba(70,210,130,.1); color: #a8f0c8; }

/* ── Notice (finished / error) ───────────────────────────────────────────── */
.ntitle { margin-top: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ntext { margin-top: 3px; color: var(--dim); font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ntext:empty { display: none; }

/* ── Drop ───────────────────────────────────────────────────────────────── */
.v-drop .card { min-height: 124px; }
.dzone {
  position: absolute; inset: 8px; border-radius: 13px; border: 1.5px dashed rgba(255,255,255,.16);
  transition: border-color .3s ease, opacity .3s ease; pointer-events: none;
}
#dropCard[data-phase="over"] .dzone { border-color: rgba(var(--t-blue),.55); }
#dropCard:not([data-phase="over"]) .dzone { opacity: 0; }
.dphase { display: none; }
#dropCard[data-phase="over"] .dp-over, #dropCard[data-phase="ready"] .dp-ready { display: flex; flex-direction: column; }
.dtitle { font-size: 14px; font-weight: 600; margin-top: 2px; }
.dtext { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px 3px 7px; border-radius: 8px; background: rgba(255,255,255,.07); font-size: 11.5px; color: var(--text); }
.fchip svg { width: 13px; height: 13px; flex: none; color: var(--dim); }
.fchip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Chat ───────────────────────────────────────────────────────────────── */
/* The chat card never outgrows the island (MAX_H 500 = 42 header + 448 card
   + 10 bottom): it is a column whose conversation takes what is left and
   scrolls, while the composer and model row always keep their full size.
   Without the cap, a long expanded history pushed the composer below the
   island's edge. */
.v-prompt .card { padding: 12px 12px 10px; display: flex; flex-direction: column; max-height: 448px; }
.v-prompt .card > * { flex: none; }
.v-prompt .card > .thread { flex: 0 1 auto; min-height: 0; }
.thread {
  display: none; flex-direction: column; gap: 7px; max-height: 300px; overflow-y: auto;
  margin-bottom: 12px; padding: 2px 4px 0;
}
.island[data-thread] .thread { display: flex; }
.island[data-expanded] .thread { max-height: none; }
.msg.user { color: var(--dim); font-size: 12.5px; text-align: right; }
/* one bubble per question: the live one, or a history entry's inner text
   (never both the entry and its text, which drew a bubble in a bubble) */
.msg.user:not(.arch):not(:empty), .msg.arch.user > div {
  align-self: flex-end; max-width: 80%; background: rgba(255,255,255,.06); color: #d9d8e2;
  padding: 5px 11px; border-radius: 12px; text-align: left;
}
.msg.user:empty { display: none; }
/* loaded history (double-click the thread): each earlier exchange gets room
   to breathe, and reads a step quieter than the live turn below it */
.msg.arch.user { margin-top: 12px; display: flex; justify-content: flex-end; }
.msg.arch.user:first-child { margin-top: 0; }
.msg.arch.user > div { color: #b9b8c4; }
.msg.arch.assistant { font-size: 12.5px; line-height: 1.6; color: rgba(236,235,243,.62); white-space: pre-wrap; }
.msg.agent { font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: rgba(236,235,243,.82); }
.msg.agent .w { animation: wfade .45s ease-out both; }
@keyframes wfade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
.cap { margin-top: 6px; color: var(--dim-2); font-size: 11px; }
.attach { margin: 0 2px 8px; }
.promptbox {
  display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.5);
  border: 1px solid var(--line); border-radius: 14px; padding: 7px 7px 7px 11px; transition: border-color .25s;
}
.promptbox:focus-within { border-color: rgba(255,255,255,.26); }
.promptbox input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13.5px; }
.promptbox input::placeholder { color: #66647a; }
.send { width: 30px; height: 30px; border-radius: 10px; background: var(--paper); display: grid; place-items: center; transition: background .15s, transform .12s; flex: none; }
.send:hover { background: #fff; }
.send:active { transform: scale(.94); }
.send .sico { position: relative; display: block; width: 14px; height: 14px; }
.send .sico svg { position: absolute; inset: 0; transition: opacity .2s ease, transform .32s var(--ease-out); }
.send .ico-stop { opacity: 0; transform: scale(.4) rotate(-60deg); }
.send.is-stop .ico-send { opacity: 0; transform: scale(.4) rotate(60deg); }
.send.is-stop .ico-stop { opacity: 1; transform: none; }
.row { display: flex; align-items: center; justify-content: space-between; padding-top: 9px; }
.row .right { display: flex; align-items: center; gap: 8px; }
.hint { color: var(--dim); font-size: 11.5px; }
.hint.ok { color: var(--ok); }
.hint.bad { color: var(--bad); }
.hint.ok::before { content: "\2713  "; }
.rowleft { display: flex; align-items: center; gap: 6px; min-width: 0; }
.model { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px 4px 9px; border-radius: 99px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 11.5px; transition: border-color .15s; max-width: 260px; }
.model #modelName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model:hover, .island[data-menu] .model { border-color: rgba(255,255,255,.25); }
.model svg { color: var(--dim); flex: none; }
.model .chev { transition: transform .3s var(--ease-out); }
.island[data-menu] .model .chev { transform: rotate(180deg); }
.model::after { content: ""; position: absolute; left: 0; width: 38%; bottom: 0; height: 1.5px; background: var(--paper); opacity: 0; }
.island[data-loading] .model::after { opacity: .8; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
.island[data-loading] #modelName { color: var(--dim); }
.row .icon-btn, #convBtn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); transition: color .15s, background .15s; }
#convBtn:hover { color: var(--text); background: rgba(255,255,255,.06); }

.menu {
  display: none; position: absolute; left: 10px; right: 10px; bottom: 50px; z-index: 20;
  padding: 4px; background: #101017; border: 1px solid var(--line); border-radius: 13px;
  box-shadow: 0 12px 30px rgba(0,0,0,.5); max-height: 232px; overflow-y: auto; overscroll-behavior: contain;
}
.island[data-menu] #menu, .island[data-conv] #convMenu { display: block; animation: menuin .22s var(--ease-out); }
@keyframes menuin { from { opacity: 0; transform: translateY(4px); } }
.opt { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; text-align: left; font-size: 12px; color: var(--dim); transition: background .12s, color .12s; }
.opt:hover { background: #1a1a24; color: var(--text); }
.opt:disabled { opacity: .4; cursor: default; }
.opt .chk { width: 12px; color: var(--paper); font-size: 12px; }
.opt .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .mt { font-size: 11px; color: #66637d; }
.opt[aria-selected="true"] { color: var(--text); }

.island ::-webkit-scrollbar { width: 8px; height: 8px; }
.island ::-webkit-scrollbar-track, .island ::-webkit-scrollbar-corner { background: transparent; }
.island ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
.island ::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,.12); border: 2px solid rgba(0,0,0,0); border-radius: 99px; background-clip: padding-box; }

@media (prefers-reduced-motion: reduce) {
  .island, .island *, .island::after { animation: none !important; transition-duration: .01s !important; }
}
</style>
</head>
<body>

<div class="island" id="island" data-state="idle" data-mode="compact" role="group" tabindex="0" aria-label="Accuretta">
  <canvas id="field" aria-hidden="true"></canvas>

  <!-- compact -->
  <div class="view compact v-idle"><div class="pill">
    <span class="mslot"></span><span class="grow"></span>
    <span class="sdots" id="sDots"></span><span class="dot"></span>
  </div></div>

  <div class="view compact v-work"><div class="pill wings">
    <div class="wl"><span class="mslot"></span><span class="sub" id="workSub">thinking</span></div>
    <span></span>
    <div class="wr"></div>
  </div></div>

  <div class="view compact v-alert"><div class="pill">
    <span class="mslot"></span><span class="label">Approval needed</span><span class="grow"></span>
    <span class="sub" id="alertSub">1 gate</span><span class="dot amber"></span>
  </div></div>

  <div class="view compact v-ready"><div class="pill">
    <span class="mslot"></span><span class="label">Model ready</span><span class="grow"></span>
    <span class="sub" id="readySub"></span><span class="dot"></span>
  </div></div>

  <!-- expanded -->
  <div class="shell">
    <div id="header">
      <button class="tab" data-tab="home" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg></button>
      <button class="tab" data-tab="chat" aria-label="Chat" title="Chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-5 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg></button>
      <button class="tab" data-tab="new" aria-label="New session" title="New session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="hright">
        <span class="stat" id="sTpsWrap" hidden><b id="sTps">0</b> t/s</span>
        <span class="ctx" title="Context"></span>
        <button class="hbtn" id="soundBtn" data-act="sound" aria-label="Sound" title="Sound"></button>
        <button class="hbtn" data-act="open-main" aria-label="Open in main app" title="Open in main app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg></button>
        <button class="hbtn icon-btn" data-act="power" aria-label="Shut down agent" title="Shut down agent"></button>
      </div>
    </div>

    <div class="view expanded v-home"><div class="card home">
      <section class="now">
        <span class="mslot big"></span>
        <div class="nowbody">
          <div class="nowhead"><b id="hTitle">Accuretta</b>
            <button class="hbtn" data-act="open-main" aria-label="Open in main app" title="Open in main app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9 8h7v7"/></svg></button></div>
          <div class="nowmeta"><span class="sdot" id="hDot"></span><span id="hModel"></span><span id="hCount"></span></div>
          <div class="prog" id="hProg"></div>
          <div class="steps" id="hSteps"><div class="step line">Ready when you are.</div></div>
        </div>
      </section>
      <section class="others">
        <div class="seg" role="tablist"><button class="on" data-pane="sessList">Sessions</button><button data-pane="decList">Approvals</button></div>
        <div class="pane" id="sessList"><div class="empty">No other sessions</div></div>
        <div class="pane" id="decList" hidden><div class="empty">Nothing approved yet</div></div>
      </section>
    </div></div>

    <div class="view expanded v-gate"><div class="card wash avatar-card">
      <span class="mslot big"></span>
      <div class="cbody">
        <div class="who"><span class="sdot amber"></span><b id="gWho">Accuretta</b><span class="smeta" id="gSub">needs permission</span>
          <span class="tag" id="gTag">Command</span><span class="pager" id="gPager"></span></div>
        <div class="cmd" id="gCmdBox"><span id="gCmd"></span></div>
        <div class="diff" id="gDiff" hidden></div>
        <div class="meta"><span id="gStep"></span><span>Scope <em id="gScope"></em></span><span>Writes <em id="gWrites"></em></span><span id="gTarget"></span><span id="gModel" hidden></span></div>
        <div class="actions">
          <button class="btn sec" data-act="deny">Deny <kbd>N</kbd></button>
          <button class="btn pri" id="approveBtn" data-act="approve">Allow <kbd>Y</kbd></button>
          <button class="btn sec" id="alwaysBtn" data-act="always" hidden>Always</button>
          <span class="grow"></span>
          <button class="btn ghost" data-act="ask">Ask agent</button>
        </div>
      </div>
    </div></div>

    <div class="view expanded v-prompt"><div class="card">
      <div class="thread" id="thread">
        <div class="msg user" id="userMsg"></div>
        <div class="msg agent"><div id="agentMsg"></div><p class="cap">Mock reply. Nothing ran.</p></div>
      </div>
      <div class="attach" id="attach" hidden><span class="fchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span id="attachName"></span><button class="pg" data-act="unattach" aria-label="Remove file">&times;</button></span></div>
      <div class="promptbox">
        <span class="mslot"></span>
        <input id="q" type="text" placeholder="Tell Accuretta what to do" autocomplete="off" aria-label="Prompt">
        <button class="send" id="send" aria-label="Send"><span class="sico"><svg class="ico-send" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#14130f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="ico-stop" width="14" height="14" viewBox="0 0 24 24" fill="#14130f" aria-hidden="true"><rect x="6.4" y="6.4" width="11.2" height="11.2" rx="2.8"/></svg></span></button>
      </div>
      <div class="row">
        <div class="rowleft">
          <button class="model" id="model" aria-haspopup="listbox" aria-expanded="false" aria-label="Change model">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>
            <span id="modelName"></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button id="convBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Conversations" title="Switch conversation"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5h4a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v2.5l-2.6-2.5"/><path d="M5.5 8h8a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-3.5 3v-3a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2z"/></svg></button>
        </div>
        <div class="right"><span class="hint" id="hint"></span></div>
      </div>
      <div class="menu" id="menu" role="listbox" aria-label="Local models"></div>
      <div class="menu" id="convMenu" role="listbox" aria-label="Conversations"></div>
    </div></div>

    <div class="view expanded v-notice"><div class="card wash avatar-card" id="noticeCard" data-tone="green">
      <span class="mslot big"></span>
      <div class="cbody">
        <div class="who"><span class="sdot" id="nDot"></span><b id="nWho">Accuretta</b><span class="smeta" id="nSub"></span></div>
        <div class="ntitle" id="nTitle"></div>
        <div class="ntext" id="nText"></div>
        <div class="actions" id="nActions"></div>
      </div>
    </div></div>

    <div class="view expanded v-drop"><div class="card wash avatar-card" id="dropCard" data-phase="over">
      <span class="dzone"></span>
      <span class="mslot big"></span>
      <div class="cbody">
        <div class="dphase dp-over"><div class="dtitle">Drop it here</div><div class="dtext">Accuretta will read the file with you.</div></div>
        <div class="dphase dp-ready">
          <span class="fchip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg><span id="dropName"></span></span>
          <div class="dtitle" style="margin-top:8px">Ready. What should Accuretta do with it?</div>
          <div class="actions"><button class="btn pri" data-act="drop-ask">Ask about it</button><button class="btn sec" data-act="drop-cancel">Cancel</button></div>
        </div>
      </div>
    </div></div>
  </div>

  <div id="mark"><span class="mglow"></span><svg class="logo" data-cols="24"></svg></div>
  <div id="countdown"></div>
</div>

<script>
'use strict';
const MODELS = [
  { name: 'Qwen 3.8 27B', meta: 'vision' },
  { name: 'Qwen3 35B-A3B', meta: 'MoE' },
  { name: 'Qwen3 27B', meta: 'dense' }
];
const MOCK_REPLY = 'Scan finished on 10.0.0.12. Three ports are open: SSH on 22 (OpenSSH 8.9), plus HTTP on 80 and HTTPS on 443 (both nginx 1.18.0). I made no changes.\n\nThe nginx version looks old. I suggest I compare it with known advisories next. This step only reads data, so it needs no approval.';
const MOCK_GATES = [
  { cmd: 'curl -sI http://10.0.0.12', kind: 'command', step: '2 of 7', target: '10.0.0.12', who: 'Lab scan' },
  { cmd: 'nmap -sV -p 22,80,443 10.0.0.12', kind: 'command', step: '3 of 7', target: '10.0.0.12', who: 'Lab scan', always: true },
  { cmd: 'reg add "HKCU\\Software\\LabTest" /v Flag /t REG_DWORD /d 1 /f', kind: 'registry', step: '5 of 7', writes: 'registry', target: '10.0.0.12', who: 'Lab scan', path: 'HKCU\\Software\\LabTest', diff: [['-', 'Flag  REG_DWORD  0'], ['+', 'Flag  REG_DWORD  1']] }
];
const KIND_LABEL = { command: 'Command', registry: 'Registry' };
const HOLD_MS = { approve: 1000, power: 800 };
const RING = 50.27;
const HOLD_RING = '<svg class="hring" viewBox="0 0 16 16" aria-hidden="true"><circle class="trk" cx="8" cy="8" r="6"/><circle class="arc" cx="8" cy="8" r="6"/></svg>';
const POWER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>';
const RING_SVG = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke-width="3"><circle class="trk" cx="10" cy="10" r="8"/><circle class="arc" cx="10" cy="10" r="8" stroke-linecap="round" stroke-dasharray="50.27" stroke-dashoffset="50.27" transform="rotate(-90 10 10)"/></svg>';
const SOUND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const SOUND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="m16 10 4 4M20 10l-4 4"/></svg>';

const island = document.getElementById('island');
const mark = document.getElementById('mark');
const $ = (s) => document.querySelector(s);
const cfg = { mockLoadMs: 6000, demo: true };
let timer, streamTimer, loadTimer, readyTimer, compactTimer, toolTimers = [];
let modelIdx = 0, lastPrompt = 'Scan 10.0.0.12 for open ports';
let gates = [], gi = 0, approvedAny = false, lastCmd = '';
const hold = { t: null, el: null };

const emit = (type, detail = {}) => island.dispatchEvent(new CustomEvent('notch', { detail: { type, ...detail } }));
const state = () => island.dataset.state || 'idle';

document.querySelectorAll('[data-act="power"]').forEach(b => { b.innerHTML = POWER; b.dataset.hold = HOLD_MS.power; b.title = 'Hold to shut down'; });
document.querySelectorAll('.ctx').forEach(el => { el.innerHTML = RING_SVG; });

// ── Sound ────────────────────────────────────────────────────────────────
// Synthesized, never sampled: each cue is two soft, low mallet tones (a
// sine with a faint, quickly fading FM overtone for the strike, a sine an
// octave below for body), darkly low-passed and quiet, with a short room
// behind them. Every voice ramps up from silence and decays exponentially to
// -80 dB before it stops, so there is no click at the start and no hard cut
// at the end.
const Sound = (() => {
  const N = { A3: 220, C4: 261.63, D4: 293.66, E4: 329.63, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25 };
  const CUES = {
    open:    { gain: .26, dur: .55, notes: [['A4', 0], ['E5', .06]] },
    close:   { gain: .18, dur: .45, notes: [['E5', 0], ['A4', .05]] },
    gate:    { gain: .32, dur: .9,  notes: [['D4', 0], ['A4', .1]] },
    approve: { gain: .26, dur: .6,  notes: [['E4', 0], ['B4', .07]] },
    deny:    { gain: .24, dur: .55, notes: [['D4', 0], ['A3', .08]] },
    done:    { gain: .24, dur: .95, notes: [['G4', 0], ['D5', .09]] },
    error:   { gain: .28, dur: .75, notes: [['E4', 0], ['C4', .1]] },
    send:    { gain: .14, dur: .28, notes: [['A4', 0]] },
    drop:    { gain: .22, dur: .55, notes: [['G4', 0], ['C5', .07]] },
  };
  let ctx = null, bus = null, muted = false, lastAt = 0;
  try { muted = localStorage.getItem('accuretta.notch.sound') === 'off'; } catch (e) {}

const FIELD_TEXT = '.nowhead b, .nowmeta, .steps .step, .seg, .srow .nm, .empty, .task-row, .who b, .who .smeta, '
  + '.ntitle, .ntext, .meta, .msg, #liveStatus, .dtitle, .dtext, .hint';
const textRange = document.createRange();

function sceneFor() {
  const s = state();
  if (s === 'home') return 'matrix';
  if (s === 'gate') return 'topology';
  if (s === 'notice') return 'horizon';
  if (s === 'drop') return 'orbital';
  if (s === 'prompt') {
    const live = island.dataset.turn === 'live' || island.hasAttribute('data-busy');
    if (live && phase === 'thinking') return 'nebula';
    if (live && phase === 'web') return 'globe';          // fetching, searching, scanning the net
    if (live && phase === 'tool') return 'datafield';
    return 'matrix';                       // at rest, or words streaming in
  }

}

function drawField(now = performance.now()) {
  const expanded = island.dataset.mode === 'expanded';
  if (!expanded && !geo.h.animating) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (dpr !== fdpr || !fctx) {
    fdpr = dpr;
    field.width = Math.round(FW * dpr); field.height = Math.round(FH * dpr);
    field.style.width = FW + 'px'; field.style.height = FH + 'px';
    fctx = field.getContext('2d');
  }
  const ctx = fctx, w = geo.w.value, h = geo.h.value, ox = (FW - w) / 2;
  field.style.left = (-ox) + 'px';
  const want = expanded ? sceneFor() : scene;
  if (want !== scene) { prevScene = scene; prevAt = sceneAt; scene = want; sceneAt = now; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, FW, FH);
  if (h < BODY_TOP + 16) return;
  ctx.translate(ox, 0);
  const t = reduceMotion ? 0 : now / 1000;
  const k = smooth(Math.min(1, (now - sceneAt) / FIELD_FADE_MS));
  if (prevScene && k < 1) SCENES[prevScene](ctx, w, h, t, 1 - k, now - prevAt);
  if (scene) SCENES[scene](ctx, w, h, t, k, now - sceneAt);
  // Text always sits on clean black: every line of text in the view clears
  // the field behind it, with a soft edge, so the field lives in the gaps
  // and margins and never under the words.
  const view = viewEl(state());
  if (view && expanded) {
    const ir = island.getBoundingClientRect();
    ctx.globalCompositeOperation = 'destination-out';
    // smoke is soft already: a crisp cut-out reads as a dark box, so the
    // clearing behind text there is wider and gentler
    const soft = scene === 'nebula';
    ctx.filter = soft ? 'blur(14px)' : 'blur(6px)';
    ctx.fillStyle = soft ? 'rgba(0,0,0,.5)' : 'rgba(0,0,0,.92)';
    for (const el of view.querySelectorAll(FIELD_TEXT)) {
      if (!el.offsetParent) continue;            // hidden pane / empty row
      textRange.selectNodeContents(el);
      for (const r of textRange.getClientRects()) {
        if (r.width < 1) continue;
        ctx.fillRect(r.left - ir.left - 7, r.top - ir.top - 3, r.width + 14, r.height + 6);
      }
    }
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';

  ctx.globalCompositeOperation = 'destination-in';

  gy.addColorStop(bot1, '#000'); gy.addColorStop(Math.min(1, bot0), 'rgba(0,0,0,0)');

    let last = 0;
    const tick = (now) => {
      if (island.dataset.mode !== 'expanded') { fieldLoop = 0; return; }

// ── Dot-matrix A ─────────────────────────────────────────────────────────
function inPoly(x, y, p) {

  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
const BIG = [[165, 990], [625, 315], [868, 298], [500, 878], [470, 888]];
const SMALL = [[672, 648], [885, 645], [1112, 975], [862, 940]];
const X0 = 150, Y0 = 285, W = 980, H = 725;

function drawLogo(svg) {
  const cols = +svg.dataset.cols, cell = W / cols, rows = Math.ceil(H / cell);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let out = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = X0 + (c + .5) * cell, y = Y0 + (r + .5) * cell;
    if (!inPoly(x, y, BIG) && !inPoly(x, y, SMALL)) continue;
    const t = (x - X0) / W, u = (y - Y0) / H;
    const hue = 212 + t * 50 + u * 30, light = 72 - (1 - Math.abs(u - .65)) * 10;
    const k = ((1 - u) * .5 + t * .5) * .88 + Math.random() * .12;
    const mx = X0 + W / 2 - x, my = Y0 + H / 2 - y, cd = Math.hypot(mx, my) / W * .3;
    const p = 1.6 + Math.random() * 2.2, d = -Math.random() * p, lo = (.3 + Math.random() * .3).toFixed(2);
    out += `<circle cx="${x - X0}" cy="${y - Y0}" r="${cell * .42}" fill="hsl(${hue} 95% ${light}%)" style="--k:${k.toFixed(3)};--dx:${(mx * .6).toFixed(0)}px;--dy:${(my * .6).toFixed(0)}px;--cd:${cd.toFixed(2)}s;--p:${p.toFixed(2)}s;--d:${d.toFixed(2)}s;--lo:${lo}"/>`;
  }
  svg.innerHTML = out;
}

function setSession(o = {}) {

  $('#hModel').textContent = o.model || '';
  $('#hDot').className = 'sdot' + (o.state ? ' st-' + o.state : '');
  const steps = Array.isArray(o.steps) ? o.steps : [];
  const box = $('#hSteps'), prog = $('#hProg');

    row.appendChild(document.createTextNode(text));

    if (cur < 0) cur = steps.findIndex(s => s.status !== 'done');
    const done = steps.filter(s => s.status === 'done').length;
    // Reuse the segments so a step finishing fills in instead of redrawing.
    while (prog.children.length > steps.length) prog.lastChild.remove();
    while (prog.children.length < steps.length) prog.appendChild(document.createElement('i'));
    steps.forEach((s, i) => { prog.children[i].className = s.status === 'done' ? 'done' : (i === cur ? 'cur' : ''); });

  }).join('');

function addGate(g) {
  if (state() === 'off') return;
  gates.push(normGate(g));

  if (s === 'gate') renderGate();
  else if (s === 'alert') updateAlert();

    // conversation that was open comes back once it resolves.

// After the LAST gate resolves the island returns to where the owner came

function gateSettleTarget() {
  const resume = island.dataset.prevPrompt === '1';
  delete island.dataset.prevPrompt;

}

// ── Notices (finished / error) ───────────────────────────────────────────
const TONES = { green: 'var(--t-green)', red: 'var(--t-red)', amber: 'var(--t-amber)', blue: 'var(--t-blue)' };
// {tone, who, sub, title, text, actions: [{label, act, primary}]}
function notice(o = {}) {
  const tone = TONES[o.tone] ? o.tone : 'green';
  island.style.setProperty('--notice-tone', TONES[tone]);
  fieldTone = { green: [52, 211, 153], red: [244, 80, 94], amber: [245, 165, 36], blue: [111, 134, 255] }[tone];
  $('#noticeCard').dataset.tone = tone;
  $('#nDot').className = 'sdot ' + tone;
  $('#nWho').textContent = o.who || 'Accuretta';
  $('#nSub').textContent = o.sub || '';
  $('#nTitle').textContent = o.title || '';
  $('#nText').textContent = o.text || '';
  const acts = $('#nActions');
  acts.textContent = '';
  for (const a of (o.actions && o.actions.length ? o.actions : [{ label: 'OK', act: 'ok', primary: true }])) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + (a.primary ? 'pri' : 'sec');
    b.dataset.nact = a.act;
    b.textContent = a.label;
    acts.appendChild(b);
  }
  // A pending approval owns the screen; the notice waits behind it.
  if (gates.length) return;
  Sound.play(tone === 'red' ? 'error' : 'done');
  setState('notice');
}

function restTarget() {
  if (gates.length) return 'alert';
  return island.dataset.turn === 'live' ? 'work' : 'idle';
}

// ── Auto-fold ────────────────────────────────────────────────────────────
// Home and notices fold back to the pill once the pointer has been on them
// and left: a hairline drains for FOLD_MS first. One that arrives while the
// owner is away stays put until they have seen it.
const AUTO_FOLD = new Set(['home', 'notice']);
const FOLD_MS = 12000;
let pointerInside = false, visitedSinceOpen = false, foldTimer = 0;
function cancelFold() {
  clearTimeout(foldTimer); foldTimer = 0;
  const bar = $('#countdown');
  bar.style.transition = 'opacity .25s ease';
  bar.style.opacity = '0';
}
function startFold() {
  cancelFold();
  const bar = $('#countdown');
  bar.style.transition = 'none';
  bar.style.transform = 'scaleX(1)';
  bar.style.opacity = '1';
  void bar.offsetWidth;
  bar.style.transition = `transform ${FOLD_MS}ms linear, opacity .3s ease`;
  bar.style.transform = 'scaleX(0)';
  foldTimer = setTimeout(() => { foldTimer = 0; if (AUTO_FOLD.has(state()) && !pointerInside) setState(restTarget()); }, FOLD_MS);
}
function setPointerInside(v) {
  v = !!v;
  if (v === pointerInside) return;
  pointerInside = v;
  if (v) { visitedSinceOpen = true; cancelFold(); }
  else if (AUTO_FOLD.has(state()) && visitedSinceOpen) startFold();
}
island.addEventListener('pointerenter', () => setPointerInside(true));
island.addEventListener('pointerleave', () => setPointerInside(false));

// ── Models ───────────────────────────────────────────────────────────────
function renderMenu() {
  $('#modelName').textContent = MODELS[modelIdx] ? MODELS[modelIdx].name : '';
  $('#menu').innerHTML = MODELS.map((m, i) =>
    `<button class="opt" role="option" data-i="${i}" aria-selected="${i === modelIdx}"><span class="chk">${i === modelIdx ? '&#10003;' : ''}</span><span class="nm">${esc(m.name)}</span><span class="mt">${esc(m.meta || '')}</span></button>`
  ).join('');
}
renderMenu();

// Anchor a floating dropdown just above the bottom row it belongs to. It
// overlays the thread instead of growing the card, so it never leaves the
// fixed host window.
function positionMenu(menu) {
  if (!menu) return;
  const card = document.querySelector('.v-prompt .card');
  const row = document.querySelector('.v-prompt .row');
  if (!card || !row) return;
  const c = card.getBoundingClientRect();
  const r = row.getBoundingClientRect();
  menu.style.maxHeight = Math.max(60, Math.round(r.top - c.top - 12)) + 'px';
  menu.style.bottom = Math.max(8, Math.round(c.bottom - r.top + 6)) + 'px';
}
function openMenu() {
  island.setAttribute('data-menu', '');
  positionMenu($('#menu'));
  $('#model').setAttribute('aria-expanded', 'true');
}
function closeMenu() {
  if (!island.hasAttribute('data-menu')) return false;
  island.removeAttribute('data-menu');
  $('#model').setAttribute('aria-expanded', 'false');
  return true;
}

const setHint = (text, cls = '') => { const h = $('#hint'); h.className = ('hint ' + cls).trim(); h.textContent = text; };

function loadModel() {
  clearTimeout(loadTimer); clearTimeout(readyTimer);
  if (state() === 'ready') setState('idle');
  island.removeAttribute('data-ready');
  island.removeAttribute('data-loading');
  void island.offsetWidth;
  island.setAttribute('data-loading', '');
  $('#q').placeholder = `Loading ${MODELS[modelIdx].name}`;
  setHint('Loading');
  if (cfg.mockLoadMs) loadTimer = setTimeout(modelReady, cfg.mockLoadMs);
}

function modelReady() {
  if (!island.hasAttribute('data-loading')) return;
  clearTimeout(loadTimer);
  const name = MODELS[modelIdx].name;
  island.removeAttribute('data-loading');
  void island.offsetWidth;
  island.setAttribute('data-ready', '');
  $('#q').placeholder = 'Tell Accuretta what to do';
  setHint(`${name} ready`, 'ok');
  emit('modelready', { model: name });
  if (state() === 'idle') { $('#readySub').textContent = name; setState('ready'); }
  readyTimer = setTimeout(() => {
    island.removeAttribute('data-ready');
    setHint('');
    if (state() === 'ready') setState('idle');
  }, 2800);
}

function modelFailed(msg = 'Load failed') {
  if (!island.hasAttribute('data-loading')) return;
  clearTimeout(loadTimer);
  island.removeAttribute('data-loading');
  $('#q').placeholder = 'Tell Accuretta what to do';
  setHint(msg, 'bad');
  emit('modelfailed', { model: MODELS[modelIdx].name });
  readyTimer = setTimeout(() => setHint(''), 3500);
}

function setModels(list, active = 0) {
  if (!Array.isArray(list) || !list.length) return;
  MODELS.splice(0, MODELS.length, ...list);
  modelIdx = Math.max(0, Math.min(active, MODELS.length - 1));
  renderMenu();
}

// ── Chat ─────────────────────────────────────────────────────────────────
function stream(text) {
  const el = $('#agentMsg');
  el.textContent = ''; island.setAttribute('data-busy', '');
  const words = text.split(' ');
  let i = 0;
  (function tick() {
    if (i < words.length) {
      const s = document.createElement('span');
      s.className = 'w'; s.textContent = words[i++] + ' ';
      el.appendChild(s);
      $('#thread').scrollTop = 1e5;
      streamTimer = setTimeout(tick, 28 + Math.random() * 50);
    } else island.removeAttribute('data-busy');
  })();
}

function removeGate(id) {
  const i = gates.findIndex(g => g.id === id);
  if (i < 0) return;
  gates.splice(i, 1);
  if (gi >= gates.length) gi = Math.max(0, gates.length - 1);
  const s = state();
  if (!gates.length) { if (s === 'gate' || s === 'alert') setState(gateSettleTarget()); return; }
  if (s === 'gate') { renderGate(); retarget(false, true); } else if (s === 'alert') updateAlert();
}

function beginReply(userText) {
  if (userText != null) lastPrompt = userText;
  $('#userMsg').textContent = lastPrompt;
  $('#agentMsg').textContent = '';
  island.setAttribute('data-thread', '');
  setState('prompt');
  island.setAttribute('data-busy', '');
}
function appendReply(chunk) {
  const el = document.createElement('span');
  el.className = 'w'; el.textContent = chunk;
  $('#agentMsg').appendChild(el);
  $('#thread').scrollTop = 1e5;
}
function endReply() { island.removeAttribute('data-busy'); }

function setAttachment(a) {
  $('#attach').hidden = !a;
  $('#attachName').textContent = a ? a.name : '';
  $('#q').placeholder = a ? `Ask about ${a.name}` : 'Tell Accuretta what to do';
}

// ── State ────────────────────────────────────────────────────────────────
// Sound is for what needs you: a request arriving (here), and a turn
// finishing or failing (notice() and the wiring). Opening, closing, sending,
// approving and dropping are your own actions and stay silent.
function soundFor(prev, s) {
  if (!prev || prev === s) return;
  if (s === 'gate' && prev !== 'alert') Sound.play('gate');
}

function syncTabs() {
  const s = state();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on',
    (t.dataset.tab === 'home' && s === 'home') || (t.dataset.tab === 'chat' && s === 'prompt')));
}

function toggleDemoConv() {
  const menu = $('#convMenu');
  if (island.hasAttribute('data-conv')) { island.removeAttribute('data-conv'); return; }
  closeMenu();
  const rows = [['New session', '', true], ['Lab scan', 'working'], ['Refactor billing', 'needs you'], ['Weekly digest', 'finished']];
  menu.innerHTML = rows.map(([nm, mt, sel]) =>
    `<button class="opt" role="option" aria-selected="${!!sel}"><span class="chk">${sel ? '&#10003;' : ''}</span><span class="nm">${esc(nm)}</span><span class="mt">${esc(mt)}</span></button>`).join('');
  island.setAttribute('data-conv', '');
  positionMenu(menu);
}

function setState(s) {
  if (cfg.demo) island.removeAttribute('data-conv');
  clearTimeout(timer); clearTimeout(streamTimer);
  toolTimers.forEach(clearTimeout); toolTimers = [];
  closeMenu();
  const prev = island.dataset.state;
  if (s === 'off') { island.removeAttribute('data-thread'); gates = []; gi = 0; approvedAny = false; }
  if (s === 'alert' || s === 'gate') {
    if (!gates.length) { if (!cfg.demo) return setState('idle'); gates.push(normGate(MOCK_GATES[1])); }
    gi = Math.min(gi, gates.length - 1);
  }
  island.dataset.state = s;
  island.dataset.mode = isCompact(s) ? 'compact' : 'expanded';
  island.toggleAttribute('data-busy', s === 'work' || s === 'alert');
  if (s === 'gate') renderGate(); else if (s === 'alert') updateAlert();
  if (s === 'prompt') setTimeout(() => $('#q').focus({ preventScroll: true }), 120);
  if (s !== 'drop') $('#dropCard').dataset.phase = 'over';
  cancelFold();
  visitedSinceOpen = pointerInside;
  syncTabs();
  soundFor(prev, s);
  retarget();
  if (s === 'home' && prev !== 'home') emit('home');
}

function showReply() {
  $('#userMsg').textContent = lastPrompt;
  $('#agentMsg').textContent = '';
  island.setAttribute('data-thread', '');
  setState('prompt');
  setPhase('thinking');
  island.setAttribute('data-busy', '');
  timer = setTimeout(() => { setPhase('composing'); stream(MOCK_REPLY); }, 2200);
}

function runApproved() {
  setState('work');
  runTools([
    [0, lastCmd],
    [1000, 'compacting context', () => { compact(); setContext(.18); }],
    [2400, 'parsing output']
  ]);
  timer = setTimeout(() => { showReply(); setContext(.24); }, 3200);
}

function dismiss() {
  const s = state();
  if (s === 'gate') setState('alert');
  else if (s === 'prompt' || s === 'home' || s === 'notice') setState(restTarget());
  else if (s === 'drop') { dropFile = null; setState(restTarget()); }
}

// ── File drop ────────────────────────────────────────────────────────────
// Without a handler, a file dropped on a WebView navigates the whole page to
// it. Every drag is claimed; files dropped on the island open the drop card.
let dragDepth = 0, dropFile = null;
const hasFiles = (e) => !!(e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files'));
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = hasFiles(e) ? 'copy' : 'none';
});
document.addEventListener('dragenter', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth++;
  const s = state();
  if (s === 'drop' || s === 'gate' || s === 'off') return;
  $('#dropCard').dataset.phase = 'over';
  dropPhase = 'over';
  setState('drop');
});
document.addEventListener('dragleave', (e) => {
  if (!hasFiles(e)) return;
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth && state() === 'drop' && $('#dropCard').dataset.phase === 'over') setState(restTarget());
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || state() !== 'drop') { if (state() === 'drop') setState(restTarget()); return; }
  dropFile = f;
  $('#dropName').textContent = f.name;
  $('#dropCard').dataset.phase = 'ready';
  dropPhase = 'ready';
  retarget(false, true);
});
function dropAsk() {
  if (!dropFile) return setState(restTarget());
  const f = dropFile;
  dropFile = null;
  setAttachment({ name: f.name });
  emit('file', { file: f });
  island.removeAttribute('data-thread');
  setState('prompt');
}

// ── Input ────────────────────────────────────────────────────────────────
island.addEventListener('click', (e) => {
  const s = state();
  if (!e.target.closest('.menu, .model')) closeMenu();
  const h = e.target.closest('[data-hold]');
  if (h && h.dataset.hold) return;
  const tab = e.target.closest('.tab')?.dataset.tab;
  if (tab === 'home') return setState('home');
  if (tab === 'chat') return setState('prompt');
  if (tab === 'new') {
    emit('new');
    if (cfg.demo) { island.removeAttribute('data-thread'); setState('prompt'); }
    return;
  }
  const pane = e.target.closest('.seg button')?.dataset.pane;
  if (pane) return showPane(pane);
  const row = e.target.closest('.srow');
  if (row) return emit('pick', { id: row.dataset.sid });
  const nact = e.target.closest('[data-nact]')?.dataset.nact;
  if (nact) {
    if (nact === 'read') return setState('prompt');
    if (nact !== 'ok') emit('notice-act', { act: nact });
    return setState(restTarget());
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'approve') return approve();
  if (act === 'always') return approveAlways();
  if (act === 'deny') return deny();
  if (act === 'prev' || act === 'next') return navGate(act === 'next' ? 1 : -1);
  if (act === 'ask') return setState('prompt');
  if (act === 'sound') { Sound.setMuted(!Sound.muted); if (!Sound.muted) Sound.play('send'); return; }
  if (act === 'open-main') return emit('open-main');
  if (act === 'drop-ask') return dropAsk();
  if (act === 'drop-cancel') { dropFile = null; return setState(restTarget()); }
  if (act === 'unattach') { setAttachment(null); return emit('unattach'); }
  if (e.target.closest('#model')) return island.hasAttribute('data-menu') ? closeMenu() : openMenu();
  // Wired, the bridge wiring owns this button (and stops the click before it
  // gets here). The standalone preview shows a sample list instead.
  if (cfg.demo && e.target.closest('#convBtn')) return toggleDemoConv();
  if (cfg.demo && e.target.closest('#convMenu .opt')) { island.removeAttribute('data-conv'); return; }
  // Scope to the MODEL menu: the conversations dropdown reuses .opt and must
  // not be parsed as a model index (dataset.i is undefined there).
  const opt = e.target.closest('#menu .opt');
  if (opt) {
    const i = +opt.dataset.i;
    closeMenu();
    if (i !== modelIdx) { modelIdx = i; renderMenu(); loadModel(); emit('model', { model: MODELS[modelIdx].name }); }
    return;
  }
  if (s === 'idle' || s === 'ready') setState('home');
  else if (s === 'work') setState('prompt');
  else if (s === 'alert') setState('gate');
  else if (s === 'off') { setState('idle'); emit('wake'); }
});

island.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-hold]');
  if (el && el.dataset.hold) holdStart(el, ACTS[el.dataset.act]);
});
island.addEventListener('pointerout', (e) => { if (hold.el && !hold.el.contains(e.relatedTarget)) holdCancel(); });
document.addEventListener('pointerup', holdCancel);
document.addEventListener('pointercancel', holdCancel);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!closeMenu()) dismiss(); return; }
  const inField = !!(e.target.closest && e.target.closest('input, textarea'));
  if (state() === 'gate' && !inField && !e.ctrlKey && !e.altKey && !e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === 'arrowright') navGate(1);
    if (k === 'arrowleft') navGate(-1);
    if (k === 'n' && !e.repeat) return deny();
    if (k === 'a' && !e.repeat && !$('#alwaysBtn').hidden) return approveAlways();
    if ((k === 'y' || (k === 'enter' && !e.target.closest('button'))) && !e.repeat) {
      const b = $('#approveBtn');
      if (b.dataset.hold) holdStart(b, approve); else approve();
      return;
    }
  }
  if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
    const h = e.target.closest && e.target.closest('[data-hold]');
    if (h && h.dataset.hold) { e.preventDefault(); holdStart(h, ACTS[h.dataset.act]); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target === island) island.click();
});
document.addEventListener('keyup', (e) => { if (['Enter', ' ', 'y', 'Y'].includes(e.key)) holdCancel(); });
document.addEventListener('click', (e) => {
  if (!e.composedPath().includes(island)) { closeMenu(); dismiss(); }
});

function send() {
  const v = $('#q').value.trim();
  if (!v || island.hasAttribute('data-loading')) return;
  lastPrompt = v; $('#q').value = '';
  emit('send', { prompt: v, model: MODELS[modelIdx].name });
  // emit() is synchronous, so the wiring's send handler has already run by the
  // next line and opened the conversation card. Demo mode keeps its own
  // rehearsal flow and needs the pill.
  if (!cfg.demo) return;
  setAttachment(null);
  setState('work');
  setContext(.41);
  runTools([[0, 'reading scope'], [650, 'whois 10.0.0.12'], [1300, 'planning step 3']]);
  timer = setTimeout(() => MOCK_GATES.forEach(g => addGate(g)), 2000);
}
$('#send').addEventListener('click', send);
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

// ── Boot ─────────────────────────────────────────────────────────────────
if (cfg.demo) {
  setSession({ title: 'Lab scan', model: 'Qwen3 27B', state: 'working',
    steps: [{ title: 'Read the scope', status: 'done' }, { title: 'Fingerprint 10.0.0.12', status: 'done' },
            { title: 'Compare nginx with advisories', status: 'active' }, { title: 'Write the report', status: 'pending' }] });
  setSessions([{ id: 'a', title: 'Lab scan', state: 'working', current: true }, { id: 'b', title: 'Refactor billing', state: 'needs-you' },
               { id: 'c', title: 'Weekly digest', state: 'finished' }]);
}
retarget(true);

window.notch = { setState, showReply, approve, deny, addGate, setTool, setContext, setStats, compact, loadModel, modelReady, modelFailed, removeGate, setModels, beginReply, appendReply, endReply, closeMenu, positionMenu, setSession, setSessions, notice, setAttachment, setPointerInside, retarget, setPhase, sound: (n) => Sound.play(n), get state() { return state(); }, config: cfg };
</script>
</body>
</html>
